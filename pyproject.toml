[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiamen-nowcast"
version = "0.1.0"
description = "厦门市突发性强对流生消过程的智能临近预报：基于 3D U-Net 的生成式扩散模型 (PG-ST-LFM v1.1)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Xiamen Nowcast Team" },
]
license = { text = "MIT" }

dependencies = [
    # 深度学习核心
    "torch>=2.2,<2.6",
    "torchvision>=0.17",
    "pytorch-lightning>=2.2,<2.5",
    "torchmetrics>=1.3",
    "einops>=0.7",
    # 配置与日志
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "wandb>=0.16",
    "rich>=13.7",
    # 数值与统计
    "numpy>=1.24,<2.1",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    # I/O 与卫星
    "h5py>=3.10",
    "xarray>=2023.10",
    # 可视化
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    # 物理 / 评估辅助
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]
baseline = [
    # 基线对照模型
    "pysteps>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests that are slow (deselect with -m 'not slow')",
    "data: marks tests that require real data (deselect with -m 'not data')",
]
