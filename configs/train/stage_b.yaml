# Stage-B：3D U-Net + EDM 主干训练（占位，待训练入口落地后启用）
tag: stage_b_unet3d_edm

epochs: 200
gradient_clip_val: 1.0
accumulate_grad_batches: 1
precision: "bf16-mixed"

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-6

scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: ${train.epochs}
  eta_min: 1.0e-6

ema:
  enable: true
  decay: 0.9999
  update_every: 1

# Lightning Trainer 主要参数
trainer:
  accelerator: gpu
  devices: -1                # 使用全部可见 GPU
  strategy: "deepspeed_stage_2"
  log_every_n_steps: 50
  val_check_interval: 0.25   # 每 1/4 epoch 验证一次
  num_sanity_val_steps: 2

# Checkpoint 行为
checkpoint:
  monitor: "val/edm_loss"
  mode: "min"
  save_top_k: 3
  save_last: true
  every_n_epochs: 1
