# Stage-B：3D U-Net + EDM 主干训练
tag: stage_b_unet3d_edm

epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-6
betas: [0.9, 0.999]

# EMA
ema_enable: true
ema_decay: 0.9999

# 验证采样
val_sample_steps: 18
val_sample_max_batches: 4
csi_threshold_K: 240.0

# Lightning Trainer
trainer:
  max_epochs: ${train.epochs}
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0

# 训练数据加载（覆盖 data.loader 默认）
loader:
  batch_size: 4
  eval_batch_size: 2
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 4

# Checkpoint
checkpoint:
  monitor: val/edm_loss
  mode: min
  save_top_k: 3
  save_last: true
  filename: edm-{epoch:03d}-{val_edm_loss:.4f}
