# Stage-B：3D U-Net + EDM 主干训练
tag: stage_b_unet3d_edm

epochs: 200
lr: 1.0e-4
weight_decay: 1.0e-6
betas: [0.9, 0.999]

# EMA
ema_enable: true
ema_decay: 0.9999

# 验证采样
val_sample_steps: 18
val_sample_max_batches: 4
csi_threshold_K: 240.0

# 深对流像素加权（Step D 微调）：
#   true 时按 future 帧 B13 ≤ cold_weight_threshold_K 的像素，在 latent loss 里乘以 factor
cold_weight_enable: false
cold_weight_threshold_K: 220.0
cold_weight_factor: 3.0

# 残差预报：true 时扩散模型预测相对 Persistence(重复最后一帧 past latent)的变化量 Δz，
#   采样时再加回 Persistence 基线。注意：必须配合用 measure_latent_std.py residual=true
#   重新测得的 sigma_data（残差幅度更小）。
predict_residual: false

# Lightning Trainer
trainer:
  max_epochs: ${train.epochs}
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0

# 训练数据加载（覆盖 data.loader 默认）
loader:
  batch_size: 4
  eval_batch_size: 2
  num_workers: 6
  persistent_workers: true
  prefetch_factor: 4

# Checkpoint
checkpoint:
  monitor: val/edm_loss
  mode: min
  save_top_k: 3
  save_last: true
  filename: edm-{epoch:03d}-{val_edm_loss:.4f}
