# Stage-B 训练入口：data + model(UNet3D) + diffusion(EDM) + train(stage_b)
defaults:
  - data: h8_v7
  - model: unet3d_small
  - diffusion: edm
  - train: stage_b
  - _self_

seed: 2025

# Stage-A STVAE 权重（必填）
stvae_ckpt_path: null
# STVAE 网络结构（应与训练 Stage-A 时一致）
stvae:
  _target_: src.models.vae.stvae.STVAE
  in_channels: 4
  latent_channels: 8
  base_channels: 32
  num_down: 4
  seq_len: 18

# 可选：从已有扩散 ckpt 续训（命令行覆盖 ckpt_path=...）
ckpt_path: null

paths:
  root: ${oc.env:XN_ROOT,${hydra:runtime.cwd}}

# 覆盖 data：Stage-B 需要 (past, future) 切分 + 256 裁剪
data:
  mode: split
  sampler:
    enable: false              # 第一次跑先不启用，与 Stage-A 一致；待数据采样器服务化后再开
  spatial:
    crop_size: 256
    eval_crop_size: 256
    random_crop_train: true
    center_crop_eval: true
  loader:
    batch_size: ${train.loader.batch_size}
    eval_batch_size: ${train.loader.eval_batch_size}
    num_workers: ${train.loader.num_workers}
    persistent_workers: ${train.loader.persistent_workers}
    prefetch_factor: ${train.loader.prefetch_factor}
    drop_last: true

hydra:
  run:
    dir: ${oc.env:XN_ROOT,${hydra:runtime.cwd}}/outputs/diffusion/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
