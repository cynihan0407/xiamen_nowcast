# 3D U-Net 主干（small，用于冒烟与 ablation）
_target_: src.models.unet3d.unet3d.UNet3D

in_channels: 16          # latent C_z(=8) + cond C_z(=8)
out_channels: 8          # latent C_z
base_channels: 64
channel_mult: [1, 2, 2, 4]
num_res_blocks: 2
attn_resolutions: [16, 8]
time_embed_dim: 256
dropout: 0.0
num_heads: 4
attention_spatial: true
attention_temporal: true
