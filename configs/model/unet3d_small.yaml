# 3D U-Net 主干（小模型，用于打通流程 / 消融）
# 第二批文件（src/models/unet3d/unet3d.py）落地后启用
_target_: src.models.unet3d.unet3d.UNet3D

in_channels: 16          # latent C_z(=8) + past concat C_z(=8)
out_channels: 8          # latent C_z
base_channels: 96
channel_mult: [1, 2, 4, 4]
num_res_blocks: 2
attn_resolutions: [16, 8]
time_embed_dim: 384
dropout: 0.0
conv_type: "(2+1)d"      # (2+1)d | pseudo3d | full3d
attention:
  spatial: true
  temporal: true
