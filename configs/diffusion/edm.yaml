# EDM (Karras et al., NeurIPS 2022) 扩散过程
_target_: src.models.diffusion.edm.EDMDiffusion

# === 训练时 sigma 分布 (log-normal) ===========================================
sigma_data: 0.5
P_mean: -1.2
P_std:  1.2

# === 网络预条件 (preconditioning) 参数 ========================================
sigma_min: 0.002
sigma_max: 80.0
rho: 7.0

# === 推理（Heun ODE）=========================================================
num_steps: 18
S_churn: 0.0
S_min: 0.0
S_max: .inf
S_noise: 1.0
