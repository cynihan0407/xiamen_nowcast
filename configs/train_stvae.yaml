# Stage-A 训练入口：组合 data + model + train
defaults:
  - data: h8_v7
  - model: stvae
  - train: stage_a
  - _self_

seed: 2025

# 可选：从已有 .ckpt 继续训练（命令行覆盖，例 ckpt_path=outputs/.../last.ckpt）
ckpt_path: null
# true：只加载 state_dict（改 b13_weight / lr 微调时用）；false：连优化器与 epoch 一并恢复
ckpt_weights_only: false

# 与 configs/config.yaml 对齐；h8_v7.yaml 中 sampler.cache_path 依赖 paths.root
paths:
  root: ${oc.env:XN_ROOT,${hydra:runtime.cwd}}

# 覆盖 data：VAE 需要完整 18 帧序列 + 空间裁剪到 256（显存友好）
data:
  mode: raw
  sampler:
    enable: false              # VAE 阶段用 shuffle 即可，避免预扫描与 paths 依赖
  spatial:
    crop_size: 256
    eval_crop_size: 256
    random_crop_train: true
    center_crop_eval: true
  loader:
    batch_size: 2
    eval_batch_size: 2
    num_workers: 4
    drop_last: true

hydra:
  run:
    dir: ${oc.env:XN_ROOT,${hydra:runtime.cwd}}/outputs/stvae/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
